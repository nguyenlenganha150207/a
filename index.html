<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-500 to-purple-600">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Đăng nhập</h2>

    <form>
      <!-- Email -->
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="email" placeholder="Nhập email của bạn"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- Mật khẩu -->
      <div class="mb-4">
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
        <input type="password" id="password" placeholder="••••••••"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- Ghi nhớ -->
      <div class="flex items-center justify-between mb-6">
        <label class="flex items-center text-sm text-gray-600">
          <input type="checkbox" class="mr-2 accent-blue-500">
          Ghi nhớ đăng nhập
        </label>
        <a href="#" class="text-sm text-blue-600 hover:underline">Quên mật khẩu?</a>
      </div>

      <!-- Nút đăng nhập -->
      <button type="submit"
              class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
        Đăng nhập
      </button>
    </form>

    <!-- Đăng ký -->
    <p class="text-sm text-center text-gray-600 mt-6">
      Chưa có tài khoản?
      <a href="#" class="text-blue-600 font-semibold hover:underline">Đăng ký ngay</a>
    </p>
  </div>

</body>
</html>
